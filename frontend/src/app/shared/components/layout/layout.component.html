<div class="app-layout d-flex flex-column h-100">
  <mat-toolbar color="primary" class="app-header shadow-sm d-flex align-items-center px-3">
    <button mat-icon-button (click)="toggleSidebar()" matTooltip="Toggle Menu" aria-label="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="d-flex align-items-center gap-2 ms-2">
      <mat-icon class="brand-icon">auto_awesome</mat-icon>
      <span class="brand-title">AI Career Assistant</span>
    </div>

    <span class="flex-grow-1"></span>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container flex-grow-1">
    <mat-sidenav
      #sidenav
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="isSidebarOpen"
      [class.collapsed]="!isSidebarOpen"
      class="app-sidebar"
    >
      <div class="px-3 pt-3">
        <div class="d-flex flex-column gap-2">
          <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <span class="nav-label">Dashboard</span>
          </a>

          <a mat-list-item routerLink="/documents" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>description</mat-icon>
            <span class="nav-label">Documents</span>
          </a>

          <a mat-list-item routerLink="/chat" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>forum</mat-icon>
            <span class="nav-label">AI Chat</span>
          </a>

          <a mat-list-item routerLink="/analysis" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>analytics</mat-icon>
            <span class="nav-label">Job-Fit Analysis</span>
          </a>

          <a mat-list-item routerLink="/interview" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>psychology</mat-icon>
            <span class="nav-label">Interview Prep</span>
          </a>

          <a mat-list-item routerLink="/tools" routerLinkActive="active-link" class="nav-item rounded-3">
            <mat-icon matListItemIcon>build_circle</mat-icon>
            <span class="nav-label">AI Tools</span>
          </a>
        </div>
      </div>

      <div class="sidebar-footer mt-auto p-3">
        <div class="system-info-card d-flex align-items-center gap-2 rounded-3 p-3">
          <mat-icon>info</mat-icon>
          <div class="info-details d-flex flex-column">
            <span class="info-title">System Status</span>
            <span class="info-sub">RxJS & Express Ready</span>
          </div>
        </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="container-fluid content-wrapper py-3 py-md-4">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
