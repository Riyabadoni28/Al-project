<div class="app-layout">
  <!-- Top Navigation Header -->
  <mat-toolbar color="primary" class="app-header shadow-sm">
    <button mat-icon-button (click)="sidenav.toggle()" matTooltip="Toggle Menu">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="brand-container">
      <mat-icon class="brand-icon">auto_awesome</mat-icon>
      <span class="brand-title">AI Career Assistant</span>
    </div>

    <span class="toolbar-spacer"></span>

  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <!-- Sidebar Navigation -->
    <mat-sidenav #sidenav mode="side" opened class="app-sidebar">
      <div class="sidebar-header">
        <!-- <p class="sidebar-label">NAVIGATION</p> -->
      </div>

      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/documents" routerLinkActive="active-link">
          <mat-icon matListItemIcon>description</mat-icon>
          <span matListItemTitle>Documents</span>
        </a>

        <a mat-list-item routerLink="/chat" routerLinkActive="active-link">
          <mat-icon matListItemIcon>forum</mat-icon>
          <span matListItemTitle>AI Chat</span>
        </a>

        <a mat-list-item routerLink="/analysis" routerLinkActive="active-link">
          <mat-icon matListItemIcon>analytics</mat-icon>
          <span matListItemTitle>Job-Fit Analysis</span>
        </a>

        <a mat-list-item routerLink="/interview" routerLinkActive="active-link">
          <mat-icon matListItemIcon>psychology</mat-icon>
          <span matListItemTitle>Interview Prep</span>
        </a>

        <a mat-list-item routerLink="/tools" routerLinkActive="active-link">
          <mat-icon matListItemIcon>build_circle</mat-icon>
          <span matListItemTitle>AI Tools</span>
        </a>
      </mat-nav-list>

      <div class="sidebar-footer">
        <div class="system-info-card">
          <mat-icon>info</mat-icon>
          <div class="info-details">
            <span class="info-title">System Status</span>
            <span class="info-sub">RxJS & Express Ready</span>
          </div>
        </div>
      </div>
    </mat-sidenav>

    <!-- Main Content Area -->
    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
